[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a1z-web-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "psutil>=7,<8",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
