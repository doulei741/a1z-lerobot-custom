[build-system]
requires = ["flit_core>=3.2"]
build-backend = "flit_core.buildapi"

[project]
name = "a1z_lerobot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "tyro",
    "tqdm",
    "torch",
]

[project.optional-dependencies]
# lerobot 按实际安装方式处理，不写死版本
# pip install -e /path/to/lerobot
# 或 pip install lerobot

[tool.flit.module]
name = "a1z_lerobot"
